<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Invy{% endblock %}</title>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    header { border-bottom: 1px solid #e6e6e6; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .brand a { text-decoration: none; color: inherit; font-weight: 700; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: inherit; padding: 8px 10px; border: 1px solid #e6e6e6; border-radius: 8px; }
    nav a.active { border-color: #999; font-weight: 600; }
    main { padding: 16px; }
  </style>

  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand"><a href="{{ url_for('albums_page') }}">Invy</a></div>

    <nav>
      <a href="{{ url_for('albums_page') }}" class="{% if request.path == '/' or request.path.startswith('/albums') %}active{% endif %}">Albums</a>
      <a href="{{ url_for('gear_page') }}" class="{% if request.path.startswith('/gear') %}active{% endif %}">Studio gear</a>
      <a href="{{ url_for('household_page') }}" class="{% if request.path.startswith('/household') %}active{% endif %}">Household</a>
      <a href="{{ url_for('local_page') }}" class="{% if request.path.startswith('/local') %}active{% endif %}">Local</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
