{% extends "base.html" %}
{% block title %}Edit Album{% endblock %}

{% block content %}
<h1>Edit Album</h1>

<form method="POST" enctype="multipart/form-data" action="{{ url_for('edit_album', album_id=album['id']) }}">
  <label>Artist:</label>
  <select name="artist">
    {% for artist in artists %}
      <option value="{{ artist }}" {% if artist == album['artist'] %}selected{% endif %}>{{ artist }}</option>
    {% endfor %}
  </select>
  <br>

  <label>Title:</label>
  <input type="text" name="title" value="{{ album['title'] }}">
  <br>

  <label>Release Date:</label>
  <input type="text" name="release_date" value="{{ album['release_date'] }}">
  <br>

  <label>Genre:</label>
  <select name="genre">
    {% for genre in genres %}
      <option value="{{ genre }}" {% if genre == album['genre'] %}selected{% endif %}>{{ genre }}</option>
    {% endfor %}
  </select>
  <br>

  <label>Stream Link:</label>
  <input type="url" name="stream_link" value="{{ album['stream_link'] }}">
  <br>

  <label for="mp3_file">Upload MP3:</label>
  <input type="file" name="mp3_file" accept=".mp3">
  <br>

  {% if album['mp3_file'] %}
    <p>
      Current file:
      <a href="{{ url_for('static', filename='audio/' + album['mp3_file']) }}" target="_blank" rel="noopener">
        {{ album['mp3_file'] }}
      </a>
    </p>
  {% endif %}

  <label for="formats">MyFormats:</label><br>
  <select name="formats" id="formats" multiple>
    <option value="CD" {% if 'CD' in album['formats'] %}selected{% endif %}>CD</option>
    <option value="Cassette" {% if 'Cassette' in album['formats'] %}selected{% endif %}>Cassette</option>
    <option value="Vinyl" {% if 'Vinyl' in album['formats'] %}selected{% endif %}>Vinyl</option>
    <option value="Digital" {% if 'Digital' in album['formats'] %}selected{% endif %}>Digital</option>
  </select>
  <br>

  <label>Notes:</label>
  <textarea name="notes">{{ album['notes'] }}</textarea>
  <br>

  {% if album['cover_image'] %}
    <label>Current Thumbnail:</label>
    <img src="{{ url_for('static', filename='thumbnails/' + album['cover_image']) }}"
         alt="Album Cover"
         style="max-height: 150px;">
    <br>
  {% endif %}

  <button type="submit">Save</button>
</form>

<!-- Delete Button -->
<form action="{{ url_for('delete_album', album_id=album['id']) }}" method="POST" style="margin-top: 20px;">
  <button type="submit" onclick="return confirm('Are you sure you want to delete this album?')">
    Delete Album
  </button>
</form>

<hr>

<button type="button" id="fetch-thumbnail-button">Fetch Album Cover</button>

<br><br>
<a href="{{ url_for('albums_page') }}">Back to list</a>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('fetch-thumbnail-button').addEventListener('click', function () {
  fetch('/fetch_thumbnail', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      album_id: "{{ album['id'] }}",
      artist: document.querySelector('select[name="artist"]').value,
      title: document.querySelector('input[name="title"]').value
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      alert('Thumbnail fetched successfully!');
      location.reload();
    } else {
      alert('Failed to fetch thumbnail: ' + data.error);
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('An error occurred while fetching the thumbnail.');
  });
});
</script>
{% endblock %}
