<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invy Player</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 10px; }
    .meta { font-weight: 700; }
    .sub { opacity: 0.75; font-size: 12px; margin-top: 2px; }
    .row { display:flex; gap:8px; align-items:center; margin:10px 0; }
    button { padding: 6px 10px; cursor: pointer; }
    input[type="range"] { width: 100%; }
    .time { font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="meta" id="p-title">Nothing queued</div>
  <div class="sub" id="p-sub"></div>

  <div class="row">
    <button id="p-prev" title="Previous">«</button>
    <button id="p-play" title="Play/Pause">▶</button>
    <button id="p-next" title="Next">»</button>
  </div>

  <div class="row">
    <input id="p-seek" type="range" min="0" max="1000" value="0">
  </div>

  <div class="row">
    <span class="time" id="p-cur">0:00</span>
    <span class="time">/</span>
    <span class="time" id="p-dur">0:00</span>
    <div style="flex:1"></div>
    <input id="p-vol" type="range" min="0" max="1" step="0.01" value="0.85" title="Volume">
  </div>

  <audio id="p-audio" preload="metadata"></audio>

  <script src="{{ url_for('static', filename='js/player_popout.js') }}"></script>
</body>
</html>
